background {
    monitor = DP-1
    path = ~/.config/hypr/wallpaper.png
    blur_size = 8
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor = DP-1
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(30, 30, 46)
    inner_color = rgb(24, 24, 37)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = $USER@$HOST
    color = rgb(205, 214, 244)
    font_size = 18
    font_family = Fira Code Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:1000] echo "$(date +"%A, %B %d %H:%M")"
    color = rgb(205, 214, 244)
    font_size = 14
    font_family = Fira Code Nerd Font
    position = 0, 0
    halign = center
    valign = center
}
